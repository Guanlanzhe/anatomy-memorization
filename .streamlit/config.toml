[theme]
primaryColor = "#4A90E2"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F0F2F5"
textColor = "#1F2937"
font = "serif"

[server]
headless = true
enableCORS = false
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
fastReruns = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
showSidebarNavigation = true